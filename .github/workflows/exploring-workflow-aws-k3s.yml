name: exploring workflow - AWS Kubernetes

on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - feature/aws-k3s-dev

env:
  MONGO_URI: ${{ vars.MONGO_URI || 'mongodb+srv://supercluster.d83jj.mongodb.net/superData' }}
  MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
  MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}

permissions:
  contents: read
  packages: write

jobs:
  unit-testing:
    name: Unit testing
    runs-on: ubuntu-latest

    services:
      mongo-db:
        image: siddharth67/mongo-db:non-prod
        ports:
          - 27017:27017

    env:
      MONGO_URI: mongodb://localhost:27017/superData
      MONGO_USERNAME: non-prod-user
      MONGO_PASSWORD: non-prod-password

    steps:
      - name: Checkout your branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mocha-artifacts
          path: test-results.xml
          if-no-files-found: warn

  coverage-code:
    name: Code coverage
    runs-on: ubuntu-latest

    container:
      image: node:18

    services:
      mongo-db:
        image: siddharth67/mongo-db:non-prod
        options: --name mongo

    env:
      MONGO_URI: mongodb://mongo:27017/superData
      MONGO_USERNAME: non-prod-user
      MONGO_PASSWORD: non-prod-password

    steps:
      - name: Checkout your branch
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Generate coverage report
        run: npm run coverage

      - name: Upload coverage results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-result
          path: coverage
          retention-days: 5
          if-no-files-found: warn

  docker:
    name: Build and publish Docker image
    needs:
      - unit-testing
      - coverage-code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout your branch
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}

      - name: Run Docker smoke test
        run: |
          set -euo pipefail

          docker run --name solar-system-app --detach \
            --publish 3000:3000 \
            --env "MONGO_URI=${MONGO_URI}" \
            --env "MONGO_USERNAME=${MONGO_USERNAME}" \
            --env "MONGO_PASSWORD=${MONGO_PASSWORD}" \
            "${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}"

          cleanup() {
            docker logs solar-system-app || true
            docker rm --force solar-system-app || true
          }
          trap cleanup EXIT

          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:3000/live >/dev/null; then
              echo "Docker smoke test passed"
              exit 0
            fi
            sleep 2
          done

          echo "Docker smoke test failed"
          exit 1

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/solar-system:${{ github.sha }}

  dev-deploy:
    needs: docker
    name: dev-deploy
    runs-on: ubuntu-latest

    env:
      name: dev

    steps:
      - name: Checkout your branch
        uses: actions/checkout@v4

      - name: install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: latest

      # This is the same course connection pattern. KUBECONFIG is the
      # kubeconfig copied from the AWS K3s server after Terraform deployment.
      - name: set kubernetes context
        uses: azure/k8s-set-context@v5
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: fetch kubernetes cluster details
        run: |
          set -euo pipefail
          kubectl version
          echo ------------
          kubectl get nodes -o wide
          echo ------------
          kubectl get namespaces
          kubectl config current-context
          kubectl cluster-info

      - name: create dev namespace
        run: |
          kubectl create namespace dev \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      # GitHub Secret -> Kubernetes Secret, matching the course lesson.
      - name: create Kubernetes Secret
        run: |
          set -euo pipefail
          kubectl create secret generic mongo-db-creds \
            --namespace dev \
            --from-literal=MONGO_URI="${MONGO_URI}" \
            --from-literal=MONGO_USERNAME="${MONGO_USERNAME}" \
            --from-literal=MONGO_PASSWORD="${MONGO_PASSWORD}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: replace Kubernetes placeholders
        run: |
          set -euo pipefail

          NAMESPACE=dev
          REPLICAS=1
          IMAGE="${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}"

          sed \
            -e "s|_{_NAMESPACE_}_|${NAMESPACE}|g" \
            -e "s|_{_REPLICAS_}_|${REPLICAS}|g" \
            -e "s|_{_IMAGE_}_|${IMAGE}|g" \
            kubernetes/development/deployment.yaml \
            > /tmp/deployment.yaml

          sed \
            -e "s|_{_NAMESPACE_}_|${NAMESPACE}|g" \
            kubernetes/development/service.yaml \
            > /tmp/service.yaml

          grep -E 'namespace:|replicas:|image:' /tmp/deployment.yaml

      - name: apply Kubernetes Dev manifests
        run: |
          kubectl apply -f /tmp/deployment.yaml
          kubectl apply -f /tmp/service.yaml

      - name: wait for Dev rollout
        run: |
          kubectl rollout status \
            deployment/solar-system \
            --namespace dev \
            --timeout=180s

      - name: inspect Dev deployment
        if: always()
        run: |
          kubectl get all --namespace dev
          kubectl get pods --namespace dev -o wide
          kubectl describe deployment solar-system --namespace dev
