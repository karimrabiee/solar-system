name: exploring workflow

on: 
  workflow_dispatch:
  push:

env:
    MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData'
    MONGO_USERNAME: ${{vars.MONGO_USERNAME}}
    MONGO_PASSWORD: ${{secrets.MONGO_PASSWORD}}
jobs:
    unit-testing:
     name: unit testing
     strategy:
        matrix:
            os: [ubuntu-latest, macos-latest]
            node-version: [18, 19, 20]
            exclude:
                - os: ubuntu-latest
                  node-version: 18
     runs-on: ${{matrix.os}}
     steps:
        
      - name: Checkout your branch
        uses: actions/checkout@v4

      - name: Then install Node.js version - ${{matrix.node-version}}
        uses: actions/setup-node@v6
        with:
          node-version: ${{matrix.node-version}}

      - name: install dependencies
        run: npm install

      - name: unit test
        id: unit-test
        run: npm test

      - name: archieve the results
        uses: actions/upload-artifact@v7
        if: success()
        with:
          # Name of the artifact to upload.
          # Optional. Default is 'artifact'
          name: mocha-artifacts
 
          # A file, directory or wildcard pattern that describes what to upload
          # Required.
          path: test-results.xml
    coverage-code:
     continue-on-error: true
     name: code-coverage
     runs-on: ubuntu-latest
     steps:
        
      - name: Checkout your branch
        uses: actions/checkout@v4

      - name: Then install Node.js version - ${{matrix.node-version}}
        uses: actions/setup-node@v6
        with:
          node-version: ${{matrix.node-version}}

      - name: Cache NPM Dependencies
        uses: actions/cache@v6
        with:
          path: node_modules
          # using hashFiles to generate a unique hash based on the contents of package-lock.json
          # This ensures that the cache is updated whenever package-lock.json changes
          key: ${{ runner.os }}-node_modules-${{ hashFiles('package-lock.json') }}
          

      - name: install dependencies
        run: npm install

      - name: coverage
        continue-on-error: true
        run: npm run code-coverage

      - name: archieve the results
        uses: actions/upload-artifact@v7
        with:
          # Name of the artifact to upload.
          # Optional. Default is 'artifact'
          name: Code-Coverage-Result
 
          # A file, directory or wildcard pattern that describes what to upload
          # Required.
          path: coverage
          retention-days: 5
      
