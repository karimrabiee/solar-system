name: exploring workflow

on:
  workflow_dispatch:
  push:

env:
  # Keep the MongoDB connection configurable through GitHub Variables/Secrets.
  MONGO_URI: ${{ vars.MONGO_URI || 'mongodb+srv://supercluster.d83jj.mongodb.net/superData' }}
  MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
  MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}

permissions:
  contents: read
  packages: write

jobs:
  unit-testing:
    name: Unit testing
    runs-on: ubuntu-latest

    services:
      mongo-db:
        image: siddharth67/mongo-db:non-prod
        ports:
          - 27017:27017

    env:
      MONGO_URI: mongodb://localhost:27017/superData
      MONGO_USERNAME: non-prod-user
      MONGO_PASSWORD: non-prod-password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mocha-artifacts
          path: test-results.xml
          if-no-files-found: warn

  coverage-code:
    name: Code coverage
    runs-on: ubuntu-latest

    container:
      image: node:18

    services:
      mongo-db:
        image: siddharth67/mongo-db:non-prod
        options: --name mongo

    env:
      MONGO_URI: mongodb://mongo:27017/superData
      MONGO_USERNAME: non-prod-user
      MONGO_PASSWORD: non-prod-password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Generate coverage report
        continue-on-error: true
        run: npm run coverage

      - name: Upload coverage results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: code-coverage-result
          path: coverage
          retention-days: 5
          if-no-files-found: warn

  docker:
    name: Build and publish Docker image
    needs:
      - unit-testing
      - coverage-code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}

      - name: Run Docker smoke test
        run: |
          set -euo pipefail

          docker run --name solar-system-app --detach \
            --publish 3000:3000 \
            --env "MONGO_URI=${MONGO_URI}" \
            --env "MONGO_USERNAME=${MONGO_USERNAME}" \
            --env "MONGO_PASSWORD=${MONGO_PASSWORD}" \
            "${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}"

          cleanup() {
            docker logs solar-system-app || true
            docker rm --force solar-system-app || true
          }
          trap cleanup EXIT

          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:3000/live >/dev/null; then
              echo "Docker smoke test passed"
              exit 0
            fi
            sleep 2
          done

          echo "Docker smoke test failed"
          exit 1

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/solar-system:${{ github.sha }}

  dev-deploy:
    name: Create Secret and deploy to Kubernetes Dev
    needs: docker
    runs-on: ubuntu-latest

    # This is the GitHub Environment from the course lesson.
    env:
      name: dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: latest

      # The old KUBECONFIG pointed to Docker Desktop on another machine.
      # This creates Kubernetes inside this same GitHub-hosted runner instead.
      - name: Create temporary kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: solar-system
          config: .github/kind-config.yaml
          wait: 120s

      - name: Verify Kubernetes connection
        run: |
          set -euo pipefail
          kubectl config current-context
          kubectl cluster-info
          kubectl version
          kubectl get nodes -o wide

      - name: Create dev namespace
        run: |
          kubectl create namespace dev \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      # This is the GitHub Secret -> Kubernetes Secret step from the lesson.
      - name: Create Kubernetes Secret
        run: |
          set -euo pipefail

          kubectl create secret generic mongo-db-creds \
            --namespace dev \
            --from-literal=MONGO_URI="${MONGO_URI}" \
            --from-literal=MONGO_USERNAME="${MONGO_USERNAME}" \
            --from-literal=MONGO_PASSWORD="${MONGO_PASSWORD}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      # These are the exact placeholders already present in the project manifests.
      # We render copies instead of changing the source files in Git.
      - name: Replace Kubernetes placeholders
        run: |
          set -euo pipefail

          NAMESPACE=dev
          REPLICAS=1
          IMAGE="${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}"
          INGRESS_IP=127.0.0.1

          sed \
            -e "s|_{_NAMESPACE_}_|${NAMESPACE}|g" \
            -e "s|_{_REPLICAS_}_|${REPLICAS}|g" \
            -e "s|_{_IMAGE_}_|${IMAGE}|g" \
            kubernetes/development/deployment.yaml \
            > /tmp/deployment.yaml

          sed \
            -e "s|_{_NAMESPACE_}_|${NAMESPACE}|g" \
            kubernetes/development/service.yaml \
            > /tmp/service.yaml

          sed \
            -e "s|_{_NAMESPACE_}_|${NAMESPACE}|g" \
            -e "s|_{_INGRESS_IP_}_|${INGRESS_IP}|g" \
            kubernetes/development/ingress.yaml \
            > /tmp/ingress.yaml

          echo "Rendered Deployment image:"
          grep "image:" /tmp/deployment.yaml

          echo "Rendered Deployment namespace:"
          grep "namespace:" /tmp/deployment.yaml

          echo "Rendered Ingress host:"
          grep "host:" /tmp/ingress.yaml

      - name: Apply Deployment and Service
        run: |
          kubectl apply -f /tmp/deployment.yaml
          kubectl apply -f /tmp/service.yaml

      - name: Wait for Dev rollout
        run: |
          kubectl rollout status \
            deployment/solar-system \
            --namespace dev \
            --timeout=180s

      - name: Inspect Dev resources
        if: always()
        run: |
          kubectl get all -n dev
          kubectl get secret mongo-db-creds -n dev
          kubectl get pods -n dev -o wide

      - name: Install NGINX Ingress Controller for kind
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/kind/deploy.yaml

      - name: Wait for NGINX Ingress Controller
        run: |
          kubectl wait \
            --namespace ingress-nginx \
            --for=condition=ready pod \
            --selector=app.kubernetes.io/component=controller \
            --timeout=180s

      - name: Apply Dev Ingress
        run: |
          kubectl apply -f /tmp/ingress.yaml
          kubectl get ingress -n dev

      - name: Run Dev integration test through Ingress
        run: |
          set -euo pipefail

          APP_HOST="solar-system-dev.127.0.0.1.nip.io"
          APP_URL="http://${APP_HOST}"
          echo "Application URL: ${APP_URL}"
          {
            echo "## Kubernetes Dev application"
            echo ""
            echo "The application was deployed through Ingress for this temporary runner:"
            echo ""
            echo "**${APP_URL}**"
          } >> "$GITHUB_STEP_SUMMARY"

          for attempt in {1..60}; do
            if curl --silent --show-error --fail \
              --resolve "${APP_HOST}:80:127.0.0.1" \
              "${APP_URL}/live" >/dev/null; then
              echo "Kubernetes Dev Ingress integration test passed"
              exit 0
            fi
            sleep 3
          done

          echo "Kubernetes Dev Ingress integration test failed"
          kubectl describe ingress solar-system -n dev || true
          kubectl logs -n ingress-nginx \
            -l app.kubernetes.io/component=controller \
            --tail=100 || true
          exit 1
