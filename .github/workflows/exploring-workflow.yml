name: exploring workflow

on:
  workflow_dispatch:
  push:

env:
  # Keep the MongoDB connection configurable through GitHub Variables/Secrets.
  MONGO_URI: ${{ vars.MONGO_URI || 'mongodb+srv://supercluster.d83jj.mongodb.net/superData' }}
  MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
  MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}

permissions:
  contents: read
  packages: write

jobs:
  unit-testing:
    name: Unit testing
    runs-on: ubuntu-latest

    services:
      mongo-db:
        image: siddharth67/mongo-db:non-prod
        ports:
          - 27017:27017

    env:
      MONGO_URI: mongodb://localhost:27017/superData
      MONGO_USERNAME: non-prod-user
      MONGO_PASSWORD: non-prod-password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mocha-artifacts
          path: test-results.xml
          if-no-files-found: warn

  coverage-code:
    name: Code coverage
    runs-on: ubuntu-latest

    container:
      image: node:18

    services:
      mongo-db:
        image: siddharth67/mongo-db:non-prod
        options: --name mongo

    env:
      MONGO_URI: mongodb://mongo:27017/superData
      MONGO_USERNAME: non-prod-user
      MONGO_PASSWORD: non-prod-password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Generate coverage report
        continue-on-error: true
        run: npm run coverage

      - name: Upload coverage results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: code-coverage-result
          path: coverage
          retention-days: 5
          if-no-files-found: warn

  docker:
    name: Build and publish Docker image
    needs:
      - unit-testing
      - coverage-code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}

      - name: Run Docker smoke test
        run: |
          set -euo pipefail

          docker run --name solar-system-app --detach \
            --publish 3000:3000 \
            --env "MONGO_URI=${MONGO_URI}" \
            --env "MONGO_USERNAME=${MONGO_USERNAME}" \
            --env "MONGO_PASSWORD=${MONGO_PASSWORD}" \
            "${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}"

          cleanup() {
            docker logs solar-system-app || true
            docker rm --force solar-system-app || true
          }
          trap cleanup EXIT

          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:3000/live >/dev/null; then
              echo "Docker smoke test passed"
              exit 0
            fi
            sleep 2
          done

          echo "Docker smoke test failed"
          exit 1

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/solar-system:${{ github.sha }}

  dev-deploy:
    needs: docker
    name: dev-deploy
    runs-on: ubuntu-latest

    outputs:
          app-ingress-host: ${{ steps.ingress-ip.outputs.APP_INGRESS_HOST }}

    steps:
      - name: Checkout your branch
        uses: actions/checkout@v4

      - name: install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: latest

      - name: set kubernetes context
        uses: azure/k8s-set-context@v5
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: fetch kubernetes cluster details
        run: |
          kubectl version
          echo ------------
          kubectl get nodes

      - name: Get Kubernetes node external IP
        id: get-ingress-ip
        run: |
          INGRESS_IP=$(kubectl get svc -n ingress-nginx ingress-nginx-controller \
          -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          echo "INGRESS_IP=${INGRESS_IP}" >> $GITHUB_ENV

      - name: Replace tokens in manifest files
        uses: cschleiden/replace-tokens@v1
        with:
          tokenPrefix: '_{_'
          tokenSuffix: '_}_'
          files: '["kubernetes/development/*.yaml"]'
        env:
          NAMESPACE: ${{ vars.NAMESPACE }}
          REPLICAS: ${{ vars.REPLICAS }}
          IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}
          INGRESS_IP: ${{ env.INGRESS_IP }}

      - name: Create development namespace
        run: |
          kubectl create namespace ${{ vars.NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: create mongo-db-creds secret in kubernetes cluster
        run: |
          kubectl create secret generic mongo-db-creds \
            --from-literal=MONGO_URI="${{ env.MONGO_URI }}" \
            --from-literal=MONGO_USERNAME="${{ env.MONGO_USERNAME }}" \
            --from-literal=MONGO_PASSWORD="${{ env.MONGO_PASSWORD }}" \
            --namespace ${{ vars.NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to Kubernetes cluster
        run: |
          kubectl apply -f kubernetes/development/deployment.yaml
          kubectl apply -f kubernetes/development/service.yaml
          kubectl apply -f kubernetes/development/ingress.yaml

      

      - name: set app ingress ip url output to other jobs
        id: ingress-ip
        run: |
          echo "APP_INGRESS_HOST=$(kubectl -n ${{ vars.NAMESPACE }} get ingress -o jsonpath='{.items[0].spec.tls[0].hosts[0]}')" >> $GITHUB_ENV
          
        
  integration-testing:
    needs: dev-deploy
    name: Integration testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout your branch
        uses: actions/checkout@v4

      - name: Run integration tests
        run: |
          set -euo pipefail

          for attempt in {1..30}; do
            if curl --silent --fail http://${{ needs.dev-deploy.outputs.app-ingress-host }}/live >/dev/null; then
              echo "Integration test passed"
              exit 0
            fi
            sleep 2
          done

          echo "Integration test failed"
          exit 1